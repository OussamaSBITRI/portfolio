<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --text:#1c2430; --muted:#5b6675;
  --accent:#1f4e79; --accent-2:#2e86c1; --line:#e1e5eb; --chip:#eaf1f8;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.06);
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#161d27; --text:#e7ebf0; --muted:#9aa6b5;
  --accent:#6fb1e6; --accent-2:#8fc7f2; --line:#263040; --chip:#1d2a3a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header.nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.brand{font-weight:700;color:var(--text)}
.nav nav{display:flex;gap:18px;font-size:.92rem;flex-wrap:wrap}
.nav nav a{color:var(--muted)}
.nav nav a:hover{color:var(--accent);text-decoration:none}
.tools{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font-size:.85rem;cursor:pointer;transition:all .2s ease}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .btn.primary{color:#0f141b}
.hero{padding:72px 0 48px}
.hero .wrap{display:grid;grid-template-columns:1fr 220px;gap:40px;align-items:center}
.eyebrow{color:var(--accent-2);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}
h1{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.1;margin:.3em 0}
.lead{font-size:1.1rem;color:var(--muted);max-width:620px}
.hero-contact-title{display:block;font-size:.95rem;margin:18px 0 6px}
.hero-contact-title::after{display:none}
.hero-contact{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.92rem}
.hero-contact a{color:var(--accent)}
.cta{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.cta .btn{padding:10px 16px;font-size:.95rem}
.cv-picker{position:relative}
.cv-menu{position:absolute;top:calc(100% + 8px);left:0;z-index:20;display:grid;gap:6px;min-width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}
.cv-menu[hidden]{display:none}
.cv-menu .btn{text-align:left;white-space:nowrap}
.avatar{width:220px;height:220px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-size:4rem;font-weight:700;box-shadow:var(--shadow)}
.avatar img{width:100%;height:100%;object-fit:cover}
section{padding:56px 0}
h2{font-size:1.6rem;margin:0 0 24px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.timeline{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.card header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.card h3{margin:0;font-size:1.05rem}
.date{color:var(--muted);font-size:.88rem;white-space:nowrap}
.sub{color:var(--muted);font-style:italic;margin:0 0 8px}
.card ul{margin:8px 0 0;padding-left:20px}
.card li{margin:5px 0}
.card li b{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--chip);color:var(--accent);padding:3px 10px;border-radius:999px;font-size:.8rem}
.experience-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.experience-gallery figure{margin:0;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.experience-gallery img{display:block;width:100%;height:220px;object-fit:contain}
.gallery-image-button{display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in}
.gallery-image-button:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}
.portfolio-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.portfolio-column{padding:14px}
.portfolio-column+.portfolio-column{border-left:1px solid var(--line)}
.portfolio-column h4{margin:0 0 8px;color:var(--accent);font-size:.95rem}
.portfolio-column p{margin:0;color:var(--muted);font-size:.93rem}
.image-lightbox{position:fixed;width:min(900px,calc(100% - 32px));max-width:none;max-height:calc(100% - 32px);margin:auto;padding:48px 20px 20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.image-lightbox::backdrop{background:rgba(15,20,27,.58);backdrop-filter:blur(8px)}
.image-lightbox img{display:block;max-width:100%;max-height:75vh;margin:0 auto;object-fit:contain}
.image-lightbox figcaption{margin-top:10px;color:var(--muted);text-align:center}
.lightbox-close{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--text);font-size:1.25rem;cursor:pointer}
.experience-gallery figcaption{margin-top:6px;color:var(--muted);font-size:.85rem;text-align:center}
footer{padding:28px 0;color:var(--muted);font-size:.85rem;text-align:center;border-top:1px solid var(--line)}
@media(max-width:760px){
  .hero .wrap{grid-template-columns:1fr}
  .avatar{width:150px;height:150px;font-size:2.8rem;order:-1}
  .nav nav{display:none}
  .portfolio-columns{grid-template-columns:1fr}
  .portfolio-column+.portfolio-column{border-top:1px solid var(--line);border-left:0}
}
@media print{.nav,.cta,footer{display:none}}
</style>
</head>

  ].map(([title, content])=>`<div class="portfolio-column"><h4>${title}</h4><p>${content}</p></div>`).join("");
  return `<article class="card"><header><h3>${x.role}</h3><span class="date">${x.date}</span></header>
    ${x.sub?`<p class="sub">${x.sub}</p>`:""}${images?`<div class="experience-gallery">${images}</div>`:""}<div class="portfolio-columns">${columns}</div>${tags?`<div class="chips">${tags}</div>`:""}</article>`;
}

function render(lang){
  const t = I18N[lang];
  root.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t[el.dataset.i18n]; });
  $("#image-lightbox").setAttribute("aria-label", t.image_preview);
  $(".lightbox-close").setAttribute("aria-label", t.close_preview);
  $("#exp").innerHTML = t.exp.map(card).join("");
  $("#proj").innerHTML = t.proj.map(card).join("");
  $("#lang").textContent = t.switch;
  try{ localStorage.setItem("lang", lang); }catch(e){}
}

let lang = "fr";
try{ lang = localStorage.getItem("lang") || "fr"; }catch(e){}
render(lang);
$("#lang").onclick = () => { lang = lang==="fr" ? "en" : "fr"; render(lang); };

document.addEventListener("click", event => {
  const button = event.target.closest(".gallery-image-button");
  if (!button) return;
  const image = button.querySelector("img");
  const lightbox = $("#image-lightbox");
  lightbox.querySelector("img").src = image.src;
  lightbox.querySelector("img").alt = image.alt;
  lightbox.querySelector("figcaption").textContent = button.closest("figure").querySelector("figcaption").textContent;
  lightbox.showModal();
});
$(".lightbox-close").onclick = () => $("#image-lightbox").close();
$("#image-lightbox").addEventListener("click", event => {
  if (event.target === event.currentTarget) event.currentTarget.close();
});

const cvMenuToggle = $("#cv-menu-toggle");
const cvMenu = $("#cv-menu");
function closeCvMenu(){
  cvMenu.hidden = true;
  cvMenuToggle.setAttribute("aria-expanded", "false");
}
cvMenuToggle.onclick = () => {
  const isExpanded = cvMenuToggle.getAttribute("aria-expanded") === "true";
  cvMenu.hidden = isExpanded;
  cvMenuToggle.setAttribute("aria-expanded", String(!isExpanded));
};
document.addEventListener("click", event => {
  if (!event.target.closest(".cv-picker")) closeCvMenu();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && !cvMenu.hidden) {
    closeCvMenu();
    cvMenuToggle.focus();
  }
});
cvMenu.addEventListener("click", event => {
  if (event.target.closest("a")) closeCvMenu();
});

let theme = "light";
try{ theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light"); }catch(e){}
root.dataset.theme = theme;
$("#theme").onclick = () => {
  theme = root.dataset.theme==="dark" ? "light":"dark";
  root.dataset.theme = theme;
  try{ localStorage.setItem("theme", theme); }catch(e){}
};
$("#yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
