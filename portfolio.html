<script>
(()=>{
  const root=document.documentElement;
  const requestedTheme=new URLSearchParams(location.search).get("theme");
  const requestedLanguage=new URLSearchParams(location.search).get("lang");
  if (requestedLanguage==="fr"||requestedLanguage==="en"){
    root.lang=requestedLanguage;
    try{localStorage.setItem("lang",requestedLanguage);}catch(e){}
  }
  let theme=requestedTheme==="light"||requestedTheme==="dark"?requestedTheme:null;
  if (theme){
    try{localStorage.setItem("theme",theme);}catch(e){}
  }else{
    try{theme=localStorage.getItem("theme");}catch(e){}
  }
  root.dataset.theme=theme==="light"||theme==="dark"?theme:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  root.classList.add("js");
})();
</script>
<style>
:root{

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;isolation:isolate}

.tools{display:flex;gap:8px}
.nav .tools .btn{display:inline-flex;height:36px;align-items:center;justify-content:center;font-family:inherit}

.section-progress-toggle-icon{display:none}
.section-progress-track{position:absolute;inset:0 4px;z-index:0;overflow:hidden;border-radius:999px;background:var(--line);box-shadow:inset 0 0 3px rgba(20,30,50,.22)}

.section-progress-links{position:absolute;top:0;bottom:0;left:100%;z-index:2;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;min-width:max-content;max-height:calc(100vh - 32px);overflow-y:auto;padding:0 0 0 12px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .15s ease,visibility .15s ease}

.section-progress-link{display:block;padding:2px 0;color:var(--muted);font-size:.84rem;line-height:1.35;text-align:left;white-space:nowrap}

.portfolio-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.portfolio-column{padding:14px}
.portfolio-column+.portfolio-column{border-left:1px solid var(--line)}
.portfolio-column h4{margin:0 0 8px;color:var(--accent);font-size:.95rem}
.portfolio-column p{margin:0;color:var(--muted);font-size:.93rem}
.image-lightbox{position:fixed;width:min(900px,calc(100% - 32px));max-width:none;max-height:calc(100% - 32px);margin:auto;padding:48px 20px 20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

.image-lightbox img{display:block;max-width:100%;max-height:75vh;margin:0 auto;object-fit:contain}
.image-lightbox figcaption{margin-top:10px;color:var(--muted);text-align:center}
.lightbox-close{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--text);font-size:1.25rem;cursor:pointer}
.experience-gallery figcaption{margin-top:6px;color:var(--muted);font-size:.85rem;text-align:center}
footer{padding:28px 0;color:var(--muted);font-size:.85rem;text-align:center;border-top:1px solid var(--line)}
.js .scroll-reveal{opacity:0;transform:translateY(18px)}
.js .scroll-reveal.is-visible{animation:scroll-reveal .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes scroll-reveal{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(max-width:760px){
  .hero .wrap{grid-template-columns:1fr}
  .avatar{width:150px;height:150px;font-size:2.8rem;order:-1}
  .section-progress{top:50%;right:0;left:auto;width:min(156px,calc(100vw - 32px));height:min(260px,calc(100vh - 40px));transform:translate(100%,-50%);border:1px solid var(--line);border-right:0;border-radius:16px 0 0 16px;background:var(--surface);box-shadow:var(--shadow);transition:transform .28s ease}
  .section-progress.is-open{transform:translate(0,-50%)}
  .section-progress-toggle{top:50%;bottom:auto;left:-28px;display:grid;width:56px;height:56px;transform:translateY(-50%);place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);box-shadow:var(--shadow)}

  .section-progress-track{top:16px;right:16px;bottom:16px;left:auto;width:4px}

@media print{.nav,.section-progress,.cta,footer{display:none}}
</style>
</head>

const $ = s => document.querySelector(s);
const root = document.documentElement;

function card(x){
  const tags = (x.tags||[]).map(t=>`<span class="chip">${t}</span>`).join("");
  const images = (x.images||[]).map(image=>`<figure><button class="gallery-image-button" type="button" aria-haspopup="dialog" aria-label="${image.alt}"><img src="${image.src}" alt="${image.alt}" loading="lazy"></button><figcaption>${image.caption}</figcaption></figure>`).join("");
  const t = I18N[lang];
  const columns = [
    [t.what_title, x.what],
    [t.how_title, x.how],
    [t.results_title, x.results]
  ].map(([title, content])=>`<div class="portfolio-column"><h4>${title}</h4><p>${content}</p></div>`).join("");
  return `<article class="card"><header><h3>${x.role}</h3><span class="date">${x.date}</span></header>
    ${x.sub?`<p class="sub">${x.sub}</p>`:""}${images?`<div class="experience-gallery">${images}</div>`:""}<div class="portfolio-columns">${columns}</div>${tags?`<div class="chips">${tags}</div>`:""}</article>`;
}

function render(lang){
  const t = I18N[lang];
  root.lang = lang;
  $(".home-button").setAttribute("aria-label",t.nav_home);
  $(".home-button").setAttribute("title",t.nav_home);
  $(".section-progress").setAttribute("aria-label",t.nav_progress);
  $(".section-progress-toggle").setAttribute("aria-label",t.nav_progress_toggle);
  document.querySelectorAll(".section-progress-link").forEach(link=>link.setAttribute("aria-label",t[link.dataset.progressLabel]));
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t[el.dataset.i18n]; });
  $("#image-lightbox").setAttribute("aria-label", t.image_preview);
  $(".lightbox-close").setAttribute("aria-label", t.close_preview);
  $("#exp").innerHTML = t.exp.map(card).join("");
  $("#proj").innerHTML = t.proj.map(card).join("");
  $("#lang").textContent = t.switch;
  try{ localStorage.setItem("lang", lang); }catch(e){}
}

const requestedLanguage = new URLSearchParams(location.search).get("lang");
let lang = requestedLanguage==="fr"||requestedLanguage==="en" ? requestedLanguage : "fr";
if (requestedLanguage!=="fr"&&requestedLanguage!=="en"){
  try{ lang = localStorage.getItem("lang") || "fr"; }catch(e){}
}
render(lang);
$("#lang").onclick = () => { lang = lang==="fr" ? "en" : "fr"; render(lang); requestAnimationFrame(updateHeroAvatar); };
const heroName = $(".hero h1");
const heroAbout = $("#about");
const heroAvatar = $("#hero-avatar");
function updateHeroAvatar(){
  if (matchMedia("(max-width:760px)").matches){
    heroAvatar.style.width="";
    heroAvatar.style.height="";
    heroAvatar.style.marginTop="";
    return;
  }
  const wrapRect = heroName.closest(".wrap").getBoundingClientRect();
  const nameRect = heroName.getBoundingClientRect();
  const aboutRect = heroAbout.getBoundingClientRect();
  const rangeTop = nameRect.top - wrapRect.top;
  const rangeBottom = aboutRect.bottom - wrapRect.top;
  const rangeHeight = Math.max(0,rangeBottom-rangeTop);
  const size = Math.max(0,Math.min(220,rangeHeight));
  const marginTop = rangeTop + (rangeHeight-size)/2;
  heroAvatar.style.width = `${size}px`;
  heroAvatar.style.height = `${size}px`;
  heroAvatar.style.marginTop = `${Math.max(0,marginTop)}px`;
}
window.addEventListener("resize",updateHeroAvatar);
window.addEventListener("load",updateHeroAvatar);
requestAnimationFrame(updateHeroAvatar);
const sectionProgressNav = $(".section-progress");
const sectionProgressToggle = $(".section-progress-toggle");
const sectionProgressLinks = Array.from(sectionProgressNav.querySelectorAll(".section-progress-link"));
const sectionProgressSections = sectionProgressLinks.map(link=>$(link.getAttribute("href")));
function updateSectionProgressDisclosure(){
  const canHover = matchMedia("(hover: hover) and (min-width: 761px)").matches;
  const isExpanded = sectionProgressNav.classList.contains("is-open") || (canHover && (sectionProgressNav.matches(":hover") || sectionProgressNav.matches(":focus-within")));
  sectionProgressToggle.setAttribute("aria-expanded",String(isExpanded));
}
function updateSectionProgress(){
  const maxScroll = Math.max(0,root.scrollHeight - window.innerHeight);
  const scrollPosition = Math.min(maxScroll,Math.max(0,window.scrollY));
  const sectionPositions = sectionProgressSections.map(section=>
    Math.min(maxScroll,Math.max(0,section.getBoundingClientRect().top + window.scrollY))
  );
  let progress = 0;
  if (maxScroll > 0 && sectionPositions.length > 1){
    let interval = 0;
    while (interval < sectionPositions.length - 2 && scrollPosition >= sectionPositions[interval + 1]) interval++;
    const intervalStart = sectionPositions[interval];
    const intervalEnd = sectionPositions[interval + 1];
    const intervalProgress = intervalEnd > intervalStart ? (scrollPosition - intervalStart) / (intervalEnd - intervalStart) : 1;
    progress = (interval + Math.min(1,Math.max(0,intervalProgress))) / (sectionPositions.length - 1);
  }
  sectionProgressNav.style.setProperty("--scroll-progress",`${progress * 100}%`);

  const activationLine = window.innerHeight * .2;
  let activeLink = sectionProgressLinks[0];
  for (let i=1;i<sectionProgressSections.length;i++){
    if (sectionProgressSections[i].getBoundingClientRect().top <= activationLine) activeLink = sectionProgressLinks[i];
  }
  sectionProgressLinks.forEach(link=>{
    if (link===activeLink) link.setAttribute("aria-current","location");
    else link.removeAttribute("aria-current");
  });
}
sectionProgressToggle.onclick = () => {
  sectionProgressNav.classList.toggle("is-open");
  updateSectionProgressDisclosure();
};
sectionProgressNav.addEventListener("mouseenter",updateSectionProgressDisclosure);
sectionProgressNav.addEventListener("mouseleave",updateSectionProgressDisclosure);
sectionProgressNav.addEventListener("focusin",updateSectionProgressDisclosure);
sectionProgressNav.addEventListener("focusout",()=>setTimeout(updateSectionProgressDisclosure,0));
sectionProgressNav.addEventListener("click",event=>{
  if (event.target.closest(".section-progress-link")) sectionProgressNav.classList.remove("is-open");
  updateSectionProgressDisclosure();
});
document.addEventListener("click",event=>{
  if (!sectionProgressNav.contains(event.target)){
    sectionProgressNav.classList.remove("is-open");
    updateSectionProgressDisclosure();
  }
});
window.addEventListener("scroll",updateSectionProgress,{passive:true});
window.addEventListener("resize",updateSectionProgress);
updateSectionProgress();

const requestedTheme = new URLSearchParams(location.search).get("theme");
const hasRequestedTheme = requestedTheme === "light" || requestedTheme === "dark";
let theme = hasRequestedTheme ? requestedTheme : "light";
if (hasRequestedTheme){
  try{ localStorage.setItem("theme", theme); }catch(e){}
}else{
  try{ theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light"); }catch(e){}
}
root.dataset.theme = theme;
$(".brand").addEventListener("click",event=>{
  if (location.protocol !== "file:") return;
  const destination = new URL(event.currentTarget.href);
  destination.searchParams.set("theme",root.dataset.theme);
  destination.searchParams.set("lang",root.lang);
  event.currentTarget.href = destination.href;
});
$("#theme").onclick = () => {
  theme = root.dataset.theme==="dark" ? "light":"dark";
  root.dataset.theme = theme;
  try{ localStorage.setItem("theme", theme); }catch(e){}
  if (location.protocol === "file:"){
    const url = new URL(location.href);
    url.searchParams.set("theme",theme);
    history.replaceState(null,"",url);
  }
};
$("#yr").textContent = new Date().getFullYear();

<script>
if (!matchMedia("(prefers-reduced-motion: reduce)").matches && "IntersectionObserver" in window){
  const revealTargets = document.querySelectorAll(".hero .wrap,section h2,section .timeline > .card,section .grid > .card,footer");
  const revealObserver = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if (entry.isIntersecting){
        entry.target.classList.add("is-visible");
        revealObserver.unobserve(entry.target);
      }
    });
  },{threshold:.12,rootMargin:"0px 0px -40px 0px"});
  revealTargets.forEach(element=>{
    element.classList.add("scroll-reveal");
    revealObserver.observe(element);
  });
}
</script>
<script>
if (!matchMedia("(prefers-reduced-motion: reduce)").matches){
  let ambientUpdatePending = false;
  const updateAmbientLight = () => {
    if (ambientUpdatePending) return;
    ambientUpdatePending = true;
    requestAnimationFrame(() => {
      const maxScroll = Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
      const progress = maxScroll ? Math.min(1,Math.max(0,window.scrollY/maxScroll)) : 0;
      document.documentElement.style.setProperty("--ambient-shift",`${-progress*24}%`);
      ambientUpdatePending = false;
    });
  };
  window.addEventListener("scroll",updateAmbientLight,{passive:true});
  window.addEventListener("resize",updateAmbientLight);
  updateAmbientLight();
}
</script>
