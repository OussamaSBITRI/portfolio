<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Oussama SBITRI — Curriculum Vitae</title>
<meta name="description" content="Curriculum Vitae et portfolio d'Oussama SBITRI, ingénieur mécanique spécialisé en simulation numérique.">
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --text:#1c2430; --muted:#5b6675;
  --accent:#1f4e79; --accent-2:#2e86c1; --line:#e1e5eb;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.06);
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#161d27; --text:#e7ebf0; --muted:#9aa6b5;
  --accent:#6fb1e6; --accent-2:#8fc7f2; --line:#263040;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header.nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.tools{display:flex;gap:8px;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font-size:.85rem;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.hero{padding:clamp(64px,12vh,120px) 0}
.eyebrow{color:var(--accent-2);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}
h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1;margin:.3em 0}
.lead{font-size:1.1rem;color:var(--muted);max-width:700px}
.page-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:36px}
.page-card{display:block;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);transition:transform .2s ease,border-color .2s ease}
.page-card:hover{transform:translateY(-2px);border-color:var(--accent);text-decoration:none}
.page-card strong{display:block;font-size:1.2rem;color:var(--text)}
.page-card span{display:block;margin-top:6px;color:var(--muted)}
footer{padding:24px 0;color:var(--muted);font-size:.85rem;text-align:center;border-top:1px solid var(--line)}
@media(max-width:600px){.page-links{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <div class="tools">
      <button class="btn" id="lang" aria-label="Language">EN</button>
      <button class="btn" id="theme" aria-label="Theme">◐</button>
    </div>
  </div>
</header>
<main class="hero">
  <div class="wrap">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1>Oussama SBITRI</h1>
    <p class="lead" data-i18n="tagline"></p>
    <div class="page-links">
      <a class="page-card" href="cv.html">
        <strong data-i18n="cv_title"></strong>
        <span data-i18n="cv_description"></span>
      </a>
      <a class="page-card" href="portfolio.html">
        <strong data-i18n="portfolio_title"></strong>
        <span data-i18n="portfolio_description"></span>
      </a>
    </div>
  </div>
</main>
<footer><div class="wrap">© <span id="yr"></span> Oussama SBITRI</div></footer>
<script>
const translations = {
  fr:{
    eyebrow:"Ingénieur mécanique",
    tagline:"Bienvenue sur mon espace professionnel. Consultez mon CV ou explorez les projets et leurs réalisations.",
    cv_title:"Curriculum Vitae",
    cv_description:"Parcours, expériences, compétences et formation.",
    portfolio_title:"Portfolio",
    portfolio_description:"Projets illustrés, avec leurs méthodes et résultats.",
    switch:"EN"
  },
  en:{
    eyebrow:"Mechanical Engineer",
    tagline:"Welcome to my professional profile. View my CV or explore my projects and their outcomes.",
    cv_title:"Curriculum Vitae",
    cv_description:"Experience, skills and education.",
    portfolio_title:"Portfolio",
    portfolio_description:"Projects illustrated with their methods and results.",
    switch:"FR"
  }
};
const root = document.documentElement;
let lang = "fr";
try{ lang = localStorage.getItem("lang") || "fr"; }catch(e){}
function render(){
  const t = translations[lang];
  root.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t[el.dataset.i18n]; });
  document.querySelector("#lang").textContent = t.switch;
  try{ localStorage.setItem("lang", lang); }catch(e){}
}
render();
document.querySelector("#lang").onclick = () => { lang = lang==="fr" ? "en" : "fr"; render(); };
let theme = "light";
try{ theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light"); }catch(e){}
root.dataset.theme = theme;
document.querySelector("#theme").onclick = () => {
  theme = root.dataset.theme==="dark" ? "light":"dark";
  root.dataset.theme = theme;
  try{ localStorage.setItem("theme", theme); }catch(e){}
};
document.querySelector("#yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
