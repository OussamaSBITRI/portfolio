<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Oussama SBITRI — Curriculum Vitae</title>
<meta name="description" content="Curriculum Vitae et portfolio d'Oussama SBITRI, ingénieur mécanique spécialisé en conception, simulation, et la gestion des projets.">
<script>
(()=>{
  const root=document.documentElement;
  const requestedTheme=new URLSearchParams(location.search).get("theme");
  const requestedLanguage=new URLSearchParams(location.search).get("lang");
  if (requestedLanguage==="fr"||requestedLanguage==="en"){
    root.lang=requestedLanguage;
    try{localStorage.setItem("lang",requestedLanguage);}catch(e){}
  }
  let theme=requestedTheme==="light"||requestedTheme==="dark"?requestedTheme:null;
  if (theme){
    try{localStorage.setItem("theme",theme);}catch(e){}
  }else{
    try{theme=localStorage.getItem("theme");}catch(e){}
  }
  root.dataset.theme=theme==="light"||theme==="dark"?theme:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  root.classList.add("js");
})();
</script>
<style>
:root{
  --bg:#e7e9ec; --surface:#f2f3f5; --text:#20242a; --muted:#626a74;
  --accent:#1f4e79; --accent-2:#2e86c1; --line:#cfd3d8;
  --shadow:0 1px 2px rgba(20,24,30,.08),0 8px 24px rgba(20,24,30,.09);
}
:root[data-theme="dark"]{
  --bg:#080a0d; --surface:#11151a; --text:#e5e8ec; --muted:#a0a7b0;
  --accent:#6fb1e6; --accent-2:#8fc7f2; --line:#242a32;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;isolation:isolate}
body::before{content:"";position:fixed;inset:-80vh -15vw;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 18% 24%,color-mix(in srgb,var(--accent-2) 28%,transparent),transparent 58%),radial-gradient(ellipse at 82% 76%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 55%);opacity:.34;transform:translate3d(0,var(--ambient-shift,0%),0)}
:root[data-theme="dark"] body::before{opacity:.48}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header.nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.tools{display:flex;gap:8px;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font-size:.85rem;cursor:pointer;transition:all .2s ease}
.nav .tools .btn{display:inline-flex;height:36px;align-items:center;justify-content:center;font-family:inherit}
.btn:hover{border-color:var(--accent)}
.nav .tools .btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 0 10px color-mix(in srgb,var(--accent-2) 18%,transparent);transform:none}
.hero{padding:clamp(64px,12vh,120px) 0}
.eyebrow{color:var(--accent-2);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}
h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1;margin:.3em 0}
.lead{font-size:1.1rem;color:var(--muted);max-width:700px}
.page-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:36px}
.page-card{display:block;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);transition:all .2s ease}
.page-card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 0 10px color-mix(in srgb,var(--accent-2) 18%,transparent);text-decoration:none}
.page-card strong{display:block;font-size:1.2rem;color:var(--text)}
.page-card span{display:block;margin-top:6px;color:var(--muted)}
.js .scroll-reveal{opacity:0;transform:translateY(18px)}
.js .scroll-reveal.is-visible{animation:scroll-reveal .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes scroll-reveal{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
footer{padding:24px 0;color:var(--muted);font-size:.85rem;text-align:center;border-top:1px solid var(--line)}
@media(max-width:600px){.page-links{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.js .scroll-reveal{opacity:1;transform:none;animation:none}body::before{transform:none}}
</style>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <div class="tools">
      <button class="btn" id="lang" aria-label="Language">EN</button>
      <button class="btn" id="theme" aria-label="Theme">◐</button>
    </div>
  </div>
</header>
<main class="hero">
  <div class="wrap">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1>Oussama SBITRI</h1>
    <p class="lead" data-i18n="tagline"></p>
    <div class="page-links">
      <a class="page-card" href="cv.html">
        <strong data-i18n="cv_title"></strong>
        <span data-i18n="cv_description"></span>
      </a>
      <a class="page-card" href="portfolio.html">
        <strong data-i18n="portfolio_title"></strong>
        <span data-i18n="portfolio_description"></span>
      </a>
    </div>
  </div>
</main>
<footer><div class="wrap">© <span id="yr"></span> Oussama SBITRI</div></footer>
<script>
const translations = {
  fr:{
    eyebrow:"Ingénieur mécanique",
    tagline:"Bienvenue sur mon espace professionnel. Consultez mon CV ou explorez les projets et leurs réalisations.",
    cv_title:"Curriculum Vitae",
    cv_description:"Parcours, expériences, compétences et formation.",
    portfolio_title:"Portfolio",
    portfolio_description:"Projets illustrés, avec leurs méthodes et résultats.",
    switch:"EN"
  },
  en:{
    eyebrow:"Mechanical Engineer",
    tagline:"Welcome to my professional profile. View my CV or explore my projects and their outcomes.",
    cv_title:"Curriculum Vitae",
    cv_description:"Experience, skills and education.",
    portfolio_title:"Portfolio",
    portfolio_description:"Projects illustrated with their methods and results.",
    switch:"FR"
  }
};
const root = document.documentElement;
const requestedLanguage = new URLSearchParams(location.search).get("lang");
let lang = requestedLanguage==="fr"||requestedLanguage==="en" ? requestedLanguage : "fr";
if (requestedLanguage!=="fr"&&requestedLanguage!=="en"){
  try{ lang = localStorage.getItem("lang") || "fr"; }catch(e){}
}
function render(){
  const t = translations[lang];
  root.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t[el.dataset.i18n]; });
  document.querySelector("#lang").textContent = t.switch;
  try{ localStorage.setItem("lang", lang); }catch(e){}
}
render();
document.querySelector("#lang").onclick = () => { lang = lang==="fr" ? "en" : "fr"; render(); };
document.querySelectorAll(".page-card").forEach(link=>{
  link.addEventListener("click",event=>{
    if (location.protocol !== "file:") return;
    const destination = new URL(event.currentTarget.href);
    destination.searchParams.set("theme",root.dataset.theme);
    destination.searchParams.set("lang",lang);
    event.currentTarget.href = destination.href;
  });
});
let theme = "light";
try{ theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light"); }catch(e){}
root.dataset.theme = theme;
document.querySelector("#theme").onclick = () => {
  theme = root.dataset.theme==="dark" ? "light":"dark";
  root.dataset.theme = theme;
  try{ localStorage.setItem("theme", theme); }catch(e){}
};
document.querySelector("#yr").textContent = new Date().getFullYear();
if (!matchMedia("(prefers-reduced-motion: reduce)").matches){
  const revealTargets = document.querySelectorAll(".hero .eyebrow,.hero h1,.hero .lead,.page-card,footer");
  if ("IntersectionObserver" in window){
    const revealObserver = new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if (entry.isIntersecting){
          entry.target.classList.add("is-visible");
          revealObserver.unobserve(entry.target);
        }
      });
    },{threshold:.12,rootMargin:"0px 0px -40px 0px"});
    revealTargets.forEach(element=>{
      element.classList.add("scroll-reveal");
      revealObserver.observe(element);
    });
  }
}
</script>
<script>
if (!matchMedia("(prefers-reduced-motion: reduce)").matches){
  let ambientUpdatePending = false;
  const updateAmbientLight = () => {
    if (ambientUpdatePending) return;
    ambientUpdatePending = true;
    requestAnimationFrame(() => {
      const maxScroll = Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
      const progress = maxScroll ? Math.min(1,Math.max(0,window.scrollY/maxScroll)) : 0;
      document.documentElement.style.setProperty("--ambient-shift",`${-progress*24}%`);
      ambientUpdatePending = false;
    });
  };
  window.addEventListener("scroll",updateAmbientLight,{passive:true});
  window.addEventListener("resize",updateAmbientLight);
  updateAmbientLight();
}
</script>
</body>
</html>
