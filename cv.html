<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --text:#1c2430; --muted:#5b6675;
  --accent:#1f4e79; --accent-2:#2e86c1; --line:#e1e5eb; --chip:#eaf1f8;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.06);
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#161d27; --text:#e7ebf0; --muted:#9aa6b5;
  --accent:#6fb1e6; --accent-2:#8fc7f2; --line:#263040; --chip:#1d2a3a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header.nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.brand{display:inline-flex;align-items:center;padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:700;color:var(--text);transition:border-color .2s ease,box-shadow .2s ease}
.brand:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 0 10px color-mix(in srgb,var(--accent-2) 18%,transparent);text-decoration:none}
.brand:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}
.nav nav{display:flex;gap:18px;font-size:.92rem;flex-wrap:wrap}
.nav nav a{color:var(--muted)}
.nav nav a:hover{color:var(--accent);text-decoration:none}
.tools{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font-size:.85rem;cursor:pointer;transition:all .2s ease}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .btn.primary{color:#0f141b}
.hero{padding:72px 0 48px}
.hero .wrap{display:grid;grid-template-columns:1fr 220px;gap:40px;align-items:center}
.eyebrow{color:var(--accent-2);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}
h1{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.1;margin:.3em 0}
.lead{font-size:1.1rem;color:var(--muted);max-width:620px}
.hero-contact-title{display:block;font-size:.95rem;margin:18px 0 6px}
.hero-contact-title::after{display:none}
.hero-contact{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.92rem}
.hero-contact a{color:var(--accent)}
.cta{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.cta .btn{padding:10px 16px;font-size:.95rem}
.cv-picker{position:relative}
.cv-menu{position:absolute;top:calc(100% + 8px);left:0;z-index:20;display:grid;gap:6px;min-width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}
.cv-menu[hidden]{display:none}
.cv-menu .btn{text-align:left;white-space:nowrap}
.avatar{width:220px;height:220px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-size:4rem;font-weight:700;box-shadow:var(--shadow)}
.avatar img{width:100%;height:100%;object-fit:cover}
section{padding:56px 0}
h2{font-size:1.6rem;margin:0 0 24px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.timeline{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.publication-card{position:relative;overflow:hidden;padding:0}
.publication-content{position:relative;z-index:1;padding:22px;border-radius:13px;background:var(--surface);box-shadow:0 8px 16px rgba(20,30,50,.2);transition:transform .35s ease}
.publication-download-panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:inset 0 10px 18px rgba(10,20,35,.22),inset 0 -10px 18px rgba(10,20,35,.18),inset 8px 0 16px rgba(10,20,35,.12),inset -8px 0 16px rgba(10,20,35,.12)}
.publication-download-panel .btn{position:absolute;top:50%;left:90%;width:max-content;padding:6px 10px;transform:translate(-50%,-50%);text-align:center;white-space:nowrap}
.publication-card:hover .publication-content,.publication-card:focus-within .publication-content{transform:translateX(-20%)}
.card header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.card h3{margin:0;font-size:1.05rem}
.date{color:var(--muted);font-size:.88rem;white-space:nowrap}
.sub{color:var(--muted);font-style:italic;margin:0 0 8px}
.card ul{margin:8px 0 0;padding-left:20px}
.card li{margin:5px 0}
.card li b{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.hobby-card p{color:var(--muted)}
.audio-player{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:center;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.audio-play{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--text);font-size:1.1rem;cursor:pointer}
.audio-play:hover{border-color:var(--accent)}
.audio-player-controls{display:grid;gap:8px;min-width:0}
.audio-seek-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.audio-volume-row{display:grid;grid-template-columns:auto minmax(70px,140px) auto;gap:8px;align-items:center;color:var(--muted);font-size:.82rem}
.audio-player input[type="range"]{width:100%;margin:0;accent-color:var(--accent);cursor:pointer}
.audio-player input:disabled{cursor:not-allowed;opacity:.5}
.audio-time{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.audio-status{margin:0;color:var(--muted);font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--chip);color:var(--accent);padding:3px 10px;border-radius:999px;font-size:.8rem}
.skills-subtitle{margin:32px 0 12px;font-size:1.05rem}
.software-controls{display:flex;justify-content:flex-end;margin-bottom:8px}
.software-controls .btn{font-size:.8rem}
.software-carousel{position:relative;width:100vw;margin-left:calc(50% - 50vw);overflow:hidden;margin-bottom:24px}
.software-carousel::before,.software-carousel::after{content:"";position:absolute;z-index:1;top:0;bottom:0;width:clamp(28px,6vw,96px);pointer-events:none}
.software-carousel::before{left:0;background:linear-gradient(to right,var(--bg),transparent)}
.software-carousel::after{right:0;background:linear-gradient(to left,var(--bg),transparent)}
.software-track{display:flex;width:max-content;animation:software-loop 38s linear infinite}
.software-track.is-paused,.software-carousel:hover .software-track,.software-carousel:focus-within .software-track{animation-play-state:paused}
.software-group{display:flex;flex-shrink:0;gap:18px;padding-right:18px}
.software-card{text-align:center}
.software-card{width:220px;flex:0 0 220px}
.software-logo-placeholder{height:82px;display:grid;place-items:center;margin-bottom:12px;border:1px dashed var(--line);border-radius:10px;background:var(--bg);color:var(--muted);font-size:.82rem}
.software-logo-placeholder.has-logo{background:#fff;border-style:solid}
.software-logo-placeholder>a{width:100%;height:100%;display:grid;place-items:center}
.software-logo-placeholder img{max-width:90%;max-height:68px;object-fit:contain}
.software-card h3{margin:0;font-size:1rem}
.software-card ul{margin:8px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.9rem}
.software-card li{margin:3px 0}
@keyframes software-loop{to{transform:translateX(-20%)}}
.skill h3{margin:0 0 8px;font-size:1rem}
.skill p{margin:0;color:var(--muted);font-size:.93rem}
.edu{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hobbies-control{text-align:center;padding:24px 0 0}
.hobbies-control .btn{border-radius:8px 8px 0 0}
#hobbies[hidden]{display:none}
footer{padding:28px 0;color:var(--muted);font-size:.85rem;text-align:center;border-top:1px solid var(--line)}
@media(max-width:760px){
  .hero .wrap{grid-template-columns:1fr}
  .avatar{width:150px;height:150px;font-size:2.8rem;order:-1}
  .nav nav{display:none}
}
@media(hover:none){
  .publication-download-panel{position:relative;min-height:76px;justify-content:center}
  .publication-download-panel .btn{position:static;width:auto;padding:6px 10px;transform:none;white-space:nowrap}
  .publication-card:hover .publication-content,.publication-card:focus-within .publication-content{transform:none}
}
@media(prefers-reduced-motion:reduce){
  .publication-content{transition:none}
  .software-carousel{overflow-x:auto}
  .software-track{animation:none;transform:none}
  .software-group[aria-hidden="true"]{display:none}
  .software-controls{display:none}
}
@media print{.nav,.cta,footer{display:none}}
</style>

const $ = s => document.querySelector(s);
const root = document.documentElement;
const hobbyAudio = $("#hobby-audio");
const hobbyAudioPlay = $("#hobby-audio-play");
const hobbyAudioSeek = $("#hobby-audio-seek");
const hobbyAudioVolume = $("#hobby-audio-volume");
const hobbyAudioVolumeValue = $("#hobby-audio-volume-value");
const hobbyAudioCurrent = $("#hobby-audio-current");
const hobbyAudioDuration = $("#hobby-audio-duration");
const hobbyAudioStatus = $("#hobby-audio-status");
const SOFTWARE_LOGOS = {
  ANSYS: {
    src:"Logos/ANSYS.png",
    alt:"ANSYS"
  },
  "Dassault Systèmes": {
    src:"https://www.3ds.com/statics/menu/2/assets/img/logo/3ds-dark.svg",
    alt:"Dassault Systèmes"
  },
  "MSC Software": {
    src:"Logos/MSC_Software.jpg",
    alt:"MSC Software"
  },
  thermoCalc: {
    src:"Logos/thermocalc.png",
    alt:"Thermo-Calc"
  },
  "AutoPIPE Vessel": {
    src:"Logos/autopipe%20vessel.png",
    alt:"AutoPIPE Vessel"
  },
  "Microsoft Office": {
    src:"https://upload.wikimedia.org/wikipedia/commons/4/4f/Microsoft_Office_2013-2019_logo_and_wordmark.svg",
    alt:"Microsoft Office"
  }
};

function card(x){
  const tags = (x.tags||[]).map(t=>`<span class="chip">${t}</span>`).join("");
  const items = x.items ? `<ul>${x.items.map(i=>`<li>${i}</li>`).join("")}</ul>` : "";
  return `<article class="card"><header><h3>${x.role}</h3><span class="date">${x.date}</span></header>
    ${x.sub?`<p class="sub">${x.sub}</p>`:""}${items}${tags?`<div class="chips">${tags}</div>`:""}</article>`;
}

function softwareCard({brand,software}, decorative=false){
  const logo = SOFTWARE_LOGOS[brand];
  return `<article class="card software-card" role="listitem">
    <div class="software-logo-placeholder${logo ? " has-logo" : ""}"${logo ? "" : ' aria-hidden="true"'}>${logo
      ? `<a href="${logo.src}" target="_blank" rel="noopener noreferrer"${decorative ? ' tabindex="-1"' : ""}><img src="${logo.src}" alt="${logo.alt} logo"></a>`
      : I18N[lang].software_logo_placeholder}</div>
    <h3>${brand}</h3>
    ${software.length ? `<ul>${software.map(s=>`<li>${s}</li>`).join("")}</ul>` : ""}
  </article>`;
}

function softwareGroup(decorative=false){
  return `<div class="software-group" role="list"${decorative ? ' aria-hidden="true"' : ""}>${I18N[lang].software_brands.map(software=>softwareCard(software,decorative)).join("")}</div>`;
}

function render(lang){
  const t = I18N[lang];
  root.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t[el.dataset.i18n]; });
  $("#exp").innerHTML = t.exp.map(card).join("");
  $("#proj").innerHTML = t.proj.map(card).join("");
  $("#edu").innerHTML = t.edu.map(e=>`<article class="card"><div class="edu"><h3 style="margin:0">${e.role}</h3><span class="date">${e.date}</span></div><p class="sub" style="margin:6px 0 0">${e.sub}</p></article>`).join("");
  $("#software-list").innerHTML = softwareGroup()+Array.from({length:4},()=>softwareGroup(true)).join("");
  updateSoftwareMotionControl(t);
  $("#skillgrid").innerHTML = t.skills_title.map(s=>`<div class="card skill"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("");
  $("#langs").innerHTML = t.langs.map(l=>`<div class="card skill"><h3>${l[0]}</h3><p>${l[1]}</p></div>`).join("");
  $("#hobby-audio-player").setAttribute("aria-label", t.hobby_audio_player);
  hobbyAudioPlay.textContent = hobbyAudio.paused ? "▶" : "Ⅱ";
  hobbyAudioPlay.setAttribute("aria-label", hobbyAudio.paused ? t.hobby_audio_play : t.hobby_audio_pause);
  hobbyAudioSeek.setAttribute("aria-label", t.hobby_audio_seek);
  hobbyAudioVolume.setAttribute("aria-label", t.hobby_audio_volume);
  if (hobbyAudioStatus.textContent) hobbyAudioStatus.textContent = t.hobby_audio_error;
  $("#lang").textContent = t.switch;
  try{ localStorage.setItem("lang", lang); }catch(e){}
}

let softwareMotionPaused = false;
function updateSoftwareMotionControl(t){
  $("#software-list").classList.toggle("is-paused",softwareMotionPaused);
  $("#software-motion-toggle").textContent = softwareMotionPaused ? t.software_motion_resume : t.software_motion_pause;
  $("#software-motion-toggle").setAttribute("aria-pressed",String(softwareMotionPaused));
}

let lang = "fr";
try{ lang = localStorage.getItem("lang") || "fr"; }catch(e){}
render(lang);
$("#lang").onclick = () => { lang = lang==="fr" ? "en" : "fr"; render(lang); };
$("#software-motion-toggle").onclick = () => {
  softwareMotionPaused = !softwareMotionPaused;
  updateSoftwareMotionControl(I18N[lang]);
};

function formatAudioTime(seconds){
  if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
  const minutes = Math.floor(seconds / 60);
  const remainder = Math.floor(seconds % 60);
  return `${minutes}:${String(remainder).padStart(2,"0")}`;
}
function updateAudioTimeline(){
  const duration = hobbyAudio.duration;
  if (Number.isFinite(duration)){
    hobbyAudioSeek.max = String(duration);
    hobbyAudioSeek.disabled = false;
    hobbyAudioDuration.textContent = formatAudioTime(duration);
  }
  hobbyAudioSeek.value = Number.isFinite(hobbyAudio.currentTime) ? String(hobbyAudio.currentTime) : "0";
  hobbyAudioCurrent.textContent = formatAudioTime(hobbyAudio.currentTime);
}
function updateAudioPlayButton(){
  const t = I18N[lang];
  hobbyAudioPlay.textContent = hobbyAudio.paused ? "▶" : "Ⅱ";
  hobbyAudioPlay.setAttribute("aria-label", hobbyAudio.paused ? t.hobby_audio_play : t.hobby_audio_pause);
}
hobbyAudioPlay.onclick = () => {
  hobbyAudioStatus.textContent = "";
  if (hobbyAudio.paused){
    hobbyAudio.play().catch(() => { hobbyAudioStatus.textContent = I18N[lang].hobby_audio_error; });
  }else{
    hobbyAudio.pause();
  }
};
hobbyAudio.addEventListener("loadedmetadata", updateAudioTimeline);
hobbyAudio.addEventListener("durationchange", updateAudioTimeline);
hobbyAudio.addEventListener("timeupdate", updateAudioTimeline);
hobbyAudio.addEventListener("seeked", updateAudioTimeline);
hobbyAudio.addEventListener("play", updateAudioPlayButton);
hobbyAudio.addEventListener("pause", updateAudioPlayButton);
hobbyAudio.addEventListener("ended", updateAudioPlayButton);
hobbyAudio.addEventListener("playing", () => { hobbyAudioStatus.textContent = ""; });
hobbyAudio.addEventListener("error", () => { hobbyAudioStatus.textContent = I18N[lang].hobby_audio_error; });
hobbyAudioSeek.addEventListener("input", () => {
  if (Number.isFinite(hobbyAudio.duration)) hobbyAudio.currentTime = Number(hobbyAudioSeek.value);
});
hobbyAudioVolume.addEventListener("input", () => {
  hobbyAudio.volume = Number(hobbyAudioVolume.value);
  hobbyAudioVolumeValue.textContent = `${Math.round(hobbyAudio.volume * 100)}%`;
});
updateAudioTimeline();
hobbyAudio.volume = Number(hobbyAudioVolume.value);
hobbyAudio.addEventListener("volumechange", () => {
  hobbyAudioVolume.value = String(hobbyAudio.volume);
  hobbyAudioVolumeValue.textContent = `${Math.round(hobbyAudio.volume * 100)}%`;
});

const hobbiesToggle = $("#hobbies-toggle");
const hobbiesSection = $("#hobbies");
hobbiesToggle.onclick = () => {
  hobbiesSection.hidden = false;
  hobbiesToggle.setAttribute("aria-expanded", "true");
  hobbiesToggle.hidden = true;
  $("#hobbies-title").focus();
};

const cvMenuToggle = $("#cv-menu-toggle");
const cvMenu = $("#cv-menu");
function closeCvMenu(){
  cvMenu.hidden = true;
  cvMenuToggle.setAttribute("aria-expanded", "false");
}
cvMenuToggle.onclick = () => {
  const isExpanded = cvMenuToggle.getAttribute("aria-expanded") === "true";
  cvMenu.hidden = isExpanded;
  cvMenuToggle.setAttribute("aria-expanded", String(!isExpanded));
};
document.addEventListener("click", event => {
  if (!event.target.closest(".cv-picker")) closeCvMenu();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && !cvMenu.hidden) {
    closeCvMenu();
    cvMenuToggle.focus();
  }
});
cvMenu.addEventListener("click", event => {
  if (event.target.closest("a")) closeCvMenu();
});

let theme = "light";
try{ theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light"); }catch(e){}
root.dataset.theme = theme;
$("#theme").onclick = () => {
  theme = root.dataset.theme==="dark" ? "light":"dark";
  root.dataset.theme = theme;
  try{ localStorage.setItem("theme", theme); }catch(e){}
};
$("#yr").textContent = new Date().getFullYear();
</script>
